<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>FC Tremoooooon</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#15181d; --muted:#626a75; --line:#e2e5ea;
  --accent:#1f4fd8; --accent-soft:#e6ecfb; --ok:#127a3e; --ok-soft:#e3f4ea;
  --ko:#b3261e; --ko-soft:#fbe7e5; --warn:#8a5a00; --warn-soft:#fdf1d8;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1115; --card:#181b21; --ink:#e9ecf1; --muted:#9aa3ae; --line:#2a2f38;
    --accent:#7aa2ff; --accent-soft:#1d2740; --ok:#5fd08f; --ok-soft:#15291e;
    --ko:#ff8a80; --ko-soft:#2f1917; --warn:#f0c060; --warn-soft:#2e2412;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%}
a{color:var(--accent)}
header{padding:calc(14px + env(safe-area-inset-top)) 16px 10px;max-width:960px;margin:0 auto}
header h1{margin:0;font-size:22px;letter-spacing:-.01em}
header .sub{color:var(--muted);font-size:13px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .wrap{max-width:960px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:6px 12px;scrollbar-width:none}
nav .wrap::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;
  padding:8px 12px;border-radius:999px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
main{max-width:960px;margin:0 auto;padding:14px 12px calc(40px + env(safe-area-inset-bottom))}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.card h2{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.big{font-size:20px;font-weight:700;line-height:1.25}
.muted{color:var(--muted)}
.small{font-size:13px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);vertical-align:middle}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.ko{background:var(--ko-soft);color:var(--ko)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.grey{background:var(--line);color:var(--muted)}
.alert{border-radius:10px;padding:10px 12px;background:var(--warn-soft);color:var(--warn);font-size:14px;margin-top:10px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.noi td{font-weight:700}
.ruolo{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-size:12px;font-weight:700;color:#fff}
.r-P{background:#d98a00}.r-D{background:#2e9d4f}.r-C{background:#2f6fe0}.r-A{background:#d33b3b}
.section-title{margin:18px 4px 8px;font-size:15px;font-weight:700}
select{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cal-item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.cal-item:last-child{border-bottom:0}
.cal-n{font-variant-numeric:tabular-nums;font-weight:700;min-width:44px}
.cal-n small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.cal-item.corrente{background:var(--accent-soft);border-radius:10px}
.cal-altre{grid-column:1/-1;font-size:13px;color:var(--muted);display:none;padding:2px 0 4px 54px}
.cal-item.aperto .cal-altre{display:block}
.md h1,.md h2,.md h3{margin:18px 0 6px;line-height:1.25;text-transform:none;letter-spacing:0;color:var(--ink)}
.md h1{font-size:20px}.md h2{font-size:17px}.md h3{font-size:15px}
.md p{margin:8px 0}.md ul,.md ol{padding-left:22px;margin:6px 0}
.md code{background:var(--line);padding:1px 5px;border-radius:5px;font-size:13px}
.md pre{background:var(--line);padding:10px;border-radius:8px;overflow-x:auto;font-size:13px}
.md pre code{background:none;padding:0}
.md blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--accent);color:var(--muted)}
.md table{margin:8px 0}.md td,.md th{white-space:normal}
.md hr{border:0;border-top:1px solid var(--line);margin:14px 0}
kbd{font:inherit;font-size:12px;background:var(--line);padding:1px 6px;border-radius:5px}
footer{max-width:960px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <h1 id="titolo">FC Tremoooooon</h1>
  <div class="sub" id="sottotitolo"></div>
</header>
<nav><div class="wrap" role="tablist" id="tabs"></div></nav>
<main id="contenuto"></main>
<footer id="piede"></footer>

<script src="dati.js"></script>
<script>
(function(){
  const D = window.DATI;
  const $ = s => document.querySelector(s);
  if(!D){ $("#contenuto").innerHTML = '<div class="card">Dati mancanti: esegui <code>python3 strumenti/genera_sito.py</code>.</div>'; return; }

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const NOI = D.calendario.nostra_squadra;
  const RUOLI = {P:"Portieri", D:"Difensori", C:"Centrocampisti", A:"Attaccanti"};
  const giornate = D.calendario.giornate;

  // ---- calendario: giornata in corso, prossima, ultima giocata
  const nostra = g => {
    const i = g.partite.findIndex(p => p.includes(NOI));
    const p = g.partite[i];
    return { avversario: p[0] === NOI ? p[1] : p[0], casa: p[0] === NOI,
             risultato: g.risultati ? g.risultati[i] : null };
  };
  const inCorso = giornate.find(g => g.stato);
  const prossima = giornate.find(g => !g.risultati && !g.stato);
  const giocate = giornate.filter(g => g.risultati);
  const ultima = giocate[giocate.length - 1];

  const esito = (r, casa) => {
    if(!r) return "";
    const m = r.match(/^(\d+)-(\d+)/); if(!m) return "";
    const noi = casa ? +m[1] : +m[2], loro = casa ? +m[2] : +m[1];
    return noi > loro ? '<span class="pill ok">V</span>' : noi < loro ? '<span class="pill ko">S</span>' : '<span class="pill grey">N</span>';
  };

  // ---- mini renderer markdown (titoli, liste, tabelle, grassetto, link, codice)
  function inline(t){
    return esc(t)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  function md(testo){
    const righe = testo.replace(/\r/g, "").split("\n");
    let out = [], i = 0;
    while(i < righe.length){
      let r = righe[i];
      if(/^```/.test(r)){ let b=[]; i++; while(i<righe.length && !/^```/.test(righe[i])) b.push(esc(righe[i++])); i++; out.push("<pre><code>"+b.join("\n")+"</code></pre>"); continue; }
      let h = r.match(/^(#{1,6})\s+(.*)$/); if(h){ const n=Math.min(h[1].length+0,3); out.push(`<h${n}>${inline(h[2])}</h${n}>`); i++; continue; }
      if(/^\s*(---|\*\*\*)\s*$/.test(r)){ out.push("<hr>"); i++; continue; }
      if(/^\s*\|.*\|\s*$/.test(r) && i+1<righe.length && /^\s*\|[\s:|-]+\|\s*$/.test(righe[i+1])){
        const celle = s => s.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
        let html = "<div class='scroll'><table><thead><tr>"+celle(r).map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>";
        i += 2; while(i<righe.length && /^\s*\|.*\|\s*$/.test(righe[i])){ html += "<tr>"+celle(righe[i]).map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>"; i++; }
        out.push(html+"</tbody></table></div>"); continue;
      }
      if(/^\s*[-*]\s+/.test(r)){ let b=[]; while(i<righe.length && /^\s*[-*]\s+/.test(righe[i])) b.push("<li>"+inline(righe[i++].replace(/^\s*[-*]\s+/,""))+"</li>"); out.push("<ul>"+b.join("")+"</ul>"); continue; }
      if(/^\s*\d+[.)]\s+/.test(r)){ let b=[]; while(i<righe.length && /^\s*\d+[.)]\s+/.test(righe[i])) b.push("<li>"+inline(righe[i++].replace(/^\s*\d+[.)]\s+/,""))+"</li>"); out.push("<ol>"+b.join("")+"</ol>"); continue; }
      if(/^>\s?/.test(r)){ let b=[]; while(i<righe.length && /^>\s?/.test(righe[i])) b.push(inline(righe[i++].replace(/^>\s?/,""))); out.push("<blockquote>"+b.join("<br>")+"</blockquote>"); continue; }
      if(!r.trim()){ i++; continue; }
      let b=[]; while(i<righe.length && righe[i].trim() && !/^(#{1,6}\s|```|\s*[-*]\s+|\s*\d+[.)]\s+|>|\s*\|)/.test(righe[i])) b.push(inline(righe[i++]));
      if(!b.length){ b.push(inline(righe[i++])); }
      out.push("<p>"+b.join("<br>")+"</p>");
    }
    return out.join("\n");
  }

  // ---- storico: file per giornata di Serie A (gNN)
  const numeroG = nome => { const m = nome.match(/^g(\d+)/i); return m ? +m[1] : null; };
  const formazioni = D.storico.filter(f => f.tipo === "formazione");
  const consiglioPer = sa => formazioni.filter(f => numeroG(f.nome) === sa && !f.prova).pop();

  // ---- viste
  function panoramica(){
    let h = '<div class="grid">';
    if(prossima){
      const n = nostra(prossima), c = consiglioPer(prossima.serie_a);
      h += `<div class="card"><h2>Prossima da schierare</h2>
        <div class="big">${esc(NOI)} – ${esc(n.avversario)}</div>
        <div class="muted">${prossima.lega}ª giornata di lega · ${prossima.serie_a}ª di Serie A · ${n.casa ? "in casa" : "fuori casa"}</div>
        ${c ? `<p class="small">Consiglio pronto: <a href="#consiglio" data-file="${esc(c.nome)}">${esc(c.nome)}</a></p>`
            : `<div class="alert">Termine: <strong>5 minuti prima della prima partita</strong> della ${prossima.serie_a}ª giornata di Serie A. Giorno e ora non ancora calcolati: serve <kbd>/formazione</kbd>.</div>`}
      </div>`;
    }
    if(inCorso){
      const n = nostra(inCorso);
      h += `<div class="card"><h2>In corso</h2>
        <div class="big">${inCorso.lega}ª giornata · vs ${esc(n.avversario)}</div>
        <div class="muted">${inCorso.serie_a}ª di Serie A · ${esc(inCorso.stato)}</div>
        <p class="small">Parziali e voti live sul <a href="${esc(D.lega.url_lega)}" target="_blank" rel="noopener">sito della lega</a>.</p></div>`;
    }
    if(ultima){
      const n = nostra(ultima);
      h += `<div class="card"><h2>Ultimo risultato</h2>
        <div class="big">${esito(n.risultato, n.casa)} ${esc(n.risultato)}</div>
        <div class="muted">${ultima.lega}ª giornata · contro ${esc(n.avversario)}</div></div>`;
    }
    const r = D.rosa;
    h += `<div class="card"><h2>Rosa</h2>
      <div class="big">${r.giocatori.length} giocatori</div>
      <div class="muted">${r.crediti_spesi} crediti spesi · ${r.crediti_residui} residui</div>
      <p class="small">${esc(r.allenatori || "")}</p></div>`;
    h += "</div>";

    const prossimi = giornate.filter(g => !g.risultati && !g.stato).slice(0, 5);
    h += '<div class="section-title">Prossimi turni</div><div class="card">';
    h += prossimi.map(g => { const n = nostra(g); return `<div class="cal-item" style="cursor:default"><div class="cal-n">${g.lega}ª<small>SA ${g.serie_a}ª</small></div><div>${esc(n.avversario)}</div><div class="muted small">${n.casa ? "casa" : "fuori"}</div></div>`; }).join("");
    return h + "</div>";
  }

  function consiglio(scelto){
    if(!D.storico.length) return '<div class="card">Nessun file in <code>storico/</code>. Lancia <kbd>/formazione</kbd>.</div>';
    const lista = [...D.storico].reverse();
    const attivo = lista.find(f => f.nome === scelto) || lista.find(f => f.tipo === "formazione" && !f.prova)
      || lista.find(f => f.tipo === "formazione") || lista[0];
    let h = `<div class="row" style="margin-bottom:10px"><select id="sel-file">${lista.map(f =>
      `<option value="${esc(f.nome)}"${f === attivo ? " selected" : ""}>${esc(f.nome)}${f.prova ? " (prova)" : ""}</option>`).join("")}</select></div>`;
    if(attivo.prova) h += '<div class="alert" style="margin:0 0 10px">File di prova: non è un consiglio reale.</div>';
    return h + `<div class="card md">${md(attivo.testo)}</div>`;
  }

  function tabellaGiocatori(gioc, colonne){
    let h = "";
    for(const ruolo of ["P","D","C","A"]){
      const g = gioc.filter(x => x.ruolo === ruolo); if(!g.length) continue;
      h += `<div class="section-title">${RUOLI[ruolo]} <span class="muted small">${g.length}</span></div><div class="card scroll"><table><thead><tr><th></th><th>Nome</th><th>Squadra</th>${colonne.map(c=>`<th class="num">${c[1]}</th>`).join("")}</tr></thead><tbody>`;
      h += g.map(x => `<tr><td><span class="ruolo r-${ruolo}">${ruolo}</span></td><td>${esc(x.nome)}${x.nota ? ' <span class="pill warn" title="'+esc(x.nota)+'">nota</span>' : ""}</td><td>${esc(x.squadra)}</td>${colonne.map(c=>`<td class="num">${esc(x[c[0]] ?? "–")}</td>`).join("")}</tr>`).join("");
      h += "</tbody></table></div>";
    }
    return h;
  }

  function rosa(){
    const r = D.rosa;
    return `<div class="card small muted">${esc(r.squadra_fanta)} · aggiornata il ${esc(r.aggiornato)} · ${r.crediti_spesi} spesi, ${r.crediti_residui} residui</div>`
      + tabellaGiocatori(r.giocatori, [["pagato","Pagato"]]);
  }

  function calendario(){
    let h = '<div class="card">';
    h += giornate.map(g => {
      const n = nostra(g), corrente = g === inCorso || g === prossima;
      const altre = g.partite.filter(p => !p.includes(NOI)).map((p, k) => {
        const idx = g.partite.indexOf(p);
        return esc(p[0]) + " – " + esc(p[1]) + (g.risultati ? " <strong>" + esc(g.risultati[idx]) + "</strong>" : "");
      }).join("<br>");
      const stato = n.risultato ? `${esito(n.risultato, n.casa)} <span class="small">${esc(n.risultato)}</span>`
        : g === inCorso ? '<span class="pill">in corso</span>' : g === prossima ? '<span class="pill warn">prossima</span>' : `<span class="muted small">${n.casa ? "casa" : "fuori"}</span>`;
      return `<div class="cal-item${corrente ? " corrente" : ""}"><div class="cal-n">${g.lega}ª<small>SA ${g.serie_a}ª</small></div><div>${esc(n.avversario)}</div><div>${stato}</div><div class="cal-altre">${altre}</div></div>`;
    }).join("");
    return h + '</div><p class="muted small">Tocca una giornata per vedere le altre partite. SA = giornata di Serie A.</p>';
  }

  function avversari(sel){
    const sq = D.rose.squadre;
    const s = sq.find(x => x.nome === sel) || sq[0];
    const incontri = giornate.filter(g => g.partite.some(p => p.includes(NOI) && p.includes(s.nome)));
    const futuro = incontri.find(g => !g.risultati);
    let h = `<div class="row" style="margin-bottom:10px"><select id="sel-squadra">${sq.map(x => `<option${x === s ? " selected" : ""}>${esc(x.nome)}</option>`).join("")}</select></div>`;
    h += `<div class="card"><div class="big">${esc(s.nome)}</div>
      <div class="muted">${s.allenatore ? esc(s.allenatore) + " · " : ""}costo rosa ${s.costo_rosa} · ${s.crediti} crediti · valore ${s.valore_fvmp} FVMp</div>
      <p class="small">Contro di noi: ${incontri.map(g => g.lega + "ª").join(", ")}${futuro ? ` · prossimo incontro alla <strong>${futuro.lega}ª</strong> (SA ${futuro.serie_a}ª)` : ""}</p></div>`;
    return h + tabellaGiocatori(s.giocatori, [["costo","Costo"],["qa","Qa"],["fvmp","FVMp"]])
      + `<p class="muted small">${esc(D.rose.fonte)}</p>`;
  }

  function regole(){
    const L = D.lega, m = L.modificatore_difesa_dettaglio;
    const fascia = f => (f.da == null ? "< " + f.a : f.a == null ? "≥ " + f.da : f.da + " – " + f.a);
    let h = '<div class="grid">';
    h += `<div class="card"><h2>Termine</h2><div class="big">${esc(L.termine_schieramento)}</div><p class="small muted">Formazioni nascoste fino al termine. Se non schieri: ${esc(L.formazione_non_schierata)}.</p></div>`;
    h += `<div class="card"><h2>Moduli</h2><div class="big">${L.moduli_ammessi.join(" · ")}</div><p class="small muted">Panchina ${esc(L.panchina)}.</p></div>`;
    h += `<div class="card"><h2>Sostituzioni</h2><div class="big">${L.sostituzioni_automatiche} cambi · ${esc(L.tipo_sostituzioni)}</div><p class="small muted">${esc(L._nota_sostituzioni)}</p><p class="small muted"><strong>Switch ${esc(L.switch)}:</strong> ${esc(L._nota_switch)}</p></div>`;
    h += `<div class="card"><h2>Gol</h2><div class="big">1° gol a ${L.soglie_gol.primo_gol} punti, poi ogni ${L.soglie_gol.passo}</div><p class="small muted">${esc(L.soglie_gol._nota)}</p></div>`;
    h += "</div>";
    if(L.modificatore_difesa){
      h += `<div class="section-title">Modificatore difesa ${m.includi_portiere ? '<span class="pill">portiere incluso</span>' : ""}</div><div class="card scroll"><table><thead><tr><th>Media voto</th><th class="num">Bonus</th></tr></thead><tbody>${m.tabella_media_voto.map(f => `<tr><td>${fascia(f)}</td><td class="num">+${f.bonus}</td></tr>`).join("")}</tbody></table><p class="small muted">${esc(L._nota_modificatori)}</p></div>`;
    }
    h += `<div class="section-title">Bonus e malus</div><div class="card scroll"><table><tbody>${Object.entries(L.punteggi).map(([k,v]) => `<tr><td>${esc(k.replace(/_/g," "))}</td><td class="num">${v > 0 ? "+" : ""}${v}</td></tr>`).join("")}</tbody></table></div>`;
    return h + `<p class="muted small">${esc(L._fonte)}</p>`;
  }

  // ---- navigazione
  const TABS = [["panoramica","Panoramica",panoramica],["consiglio","Consiglio",consiglio],["rosa","Rosa",rosa],
                ["calendario","Calendario",calendario],["avversari","Avversari",avversari],["regole","Regole",regole]];
  let fileScelto = null, squadraScelta = null;

  function mostra(id){
    const t = TABS.find(x => x[0] === id) || TABS[0];
    document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t[0]));
    const arg = t[0] === "consiglio" ? fileScelto : t[0] === "avversari" ? squadraScelta : null;
    $("#contenuto").innerHTML = t[2](arg);
    if(location.hash !== "#" + t[0]) history.replaceState(null, "", "#" + t[0]);
  }

  $("#tabs").innerHTML = TABS.map(t => `<button role="tab" data-tab="${t[0]}">${t[1]}</button>`).join("");
  $("#tabs").addEventListener("click", e => { const b = e.target.closest("button"); if(b){ mostra(b.dataset.tab); window.scrollTo(0,0); } });
  $("#contenuto").addEventListener("click", e => {
    const a = e.target.closest("a[data-file]"); if(a){ e.preventDefault(); fileScelto = a.dataset.file; mostra("consiglio"); return; }
    const c = e.target.closest(".cal-item"); if(c && c.querySelector(".cal-altre")) c.classList.toggle("aperto");
  });
  $("#contenuto").addEventListener("change", e => {
    if(e.target.id === "sel-file"){ fileScelto = e.target.value; mostra("consiglio"); }
    if(e.target.id === "sel-squadra"){ squadraScelta = e.target.value; mostra("avversari"); }
  });
  window.addEventListener("hashchange", () => mostra(location.hash.slice(1)));

  $("#titolo").textContent = D.rosa.squadra_fanta || NOI;
  $("#sottotitolo").innerHTML = `${esc(D.lega.nome_lega)} · <a href="${esc(D.lega.url_lega)}" target="_blank" rel="noopener">apri la lega</a> · dati del ${esc(D.generato)}`;
  $("#piede").textContent = "Pagina generata dai file della cartella fanta. Lo stato dei giocatori vale solo con fonte e ora di lettura: vedi il consiglio.";
  mostra(location.hash.slice(1));
})();
</script>
</body>
</html>
